# void-pvp Rust workspace.
#
# Four library crates plus the `void-pvp` CLI binary in `void-core`. `void-core`
# deliberately has no Tauri dependency (PVP_ARCHITECTURE.md §4): that buys a CLI for
# free and lets the auth and launch path be tested without a webview.
#
# `apps/desktop/src-tauri` is NOT a member of this workspace yet. The desktop agent
# owns apps/desktop and adds its crate to `members` when it scaffolds the Tauri app;
# adding it here first would break `cargo check` for everyone until that lands.

[workspace]
resolver = "2"
members = [
    "crates/void-core",
    "crates/void-bridge",
    "crates/void-loadout",
    "crates/void-online",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"   # reqwest 0.13 MSRV; edition 2024 is not used, this is the floor its tree needs
license = "UNLICENSED"
publish = false

[workspace.dependencies]
void-core = { path = "crates/void-core" }
void-bridge = { path = "crates/void-bridge" }
void-loadout = { path = "crates/void-loadout" }
void-online = { path = "crates/void-online" }

# --- shared third-party ------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process", "signal"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", features = ["json", "form", "stream"] }
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
flate2 = "1"
crc32fast = "1"
tar = "0.4"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
keyring = "3"
tempfile = "3"
# Release channel: the signed void-client manifest and the JRE / mod JAR checksums.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
base64 = "0.22"
semver = "1"
# TLS for void-online's Realtime websocket. Both are already in the tree through reqwest's
# default rustls + aws-lc-rs + platform-verifier stack; naming them here (rather than turning on
# a tokio-tungstenite TLS feature) keeps the process on ONE crypto backend and ONE trust
# decision: the websocket verifies certificates exactly the way reqwest does.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"
