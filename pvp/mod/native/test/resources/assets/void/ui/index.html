<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>void — Ultralight fidelity probe</title>
<style>
  /* Loaded through our ULFileSystem: the path resolves inside the extracted natives directory,
     which is the same lookup the shipped UI's own @font-face rules will use. */
  @font-face {
    font-family: 'VoidTest';
    src: url('resources/fonts/Inter-Variable.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    /* Transparent: the HUD composites over the game, so the view must not paint a background. */
    background: transparent;
    font-family: 'VoidTest', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* flexbox centring */
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 520px;
    height: 300px;
    box-sizing: border-box;
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;

    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    /* gradient */
    background: linear-gradient(145deg, #1b1f2e 0%, #262b41 45%, #171a26 100%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    color: #e8ecf7;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    background: linear-gradient(90deg, #6d5efc, #22d3ee);
    color: #0b0d14;
  }

  .body {
    font-size: 14px;
    line-height: 1.5;
    color: #a9b2c9;
    flex: 1;
  }

  .meter {
    height: 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  /* CSS transition, driven from evaluateScript between frames */
  .meter .fill {
    height: 100%;
    width: 120px;
    border-radius: 999px;
    background: linear-gradient(90deg, #6d5efc, #22d3ee);
    transition: width 220ms ease-out;
  }

  .meter .fill.wide {
    width: 380px;
  }

  .stats {
    display: flex;
    gap: 14px;
  }

  .stat {
    flex: 1;
    border-radius: 10px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.05);
  }

  .stat b {
    display: block;
    font-size: 18px;
    color: #ffffff;
  }

  .stat span {
    font-size: 11px;
    color: #8792ad;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="row">
      <div class="title">VOID</div>
      <div class="badge">HYPIXEL-READY</div>
    </div>

    <div class="body">
      Rounded card, gradient fill, box shadow, flexbox and a webfont — the fidelity floor the
      in-game bundle has to clear.
    </div>

    <div class="meter"><div class="fill" id="fill"></div></div>

    <div class="stats">
      <div class="stat"><b id="fps">312</b><span>FPS</span></div>
      <div class="stat"><b>18.4</b><span>CPS</span></div>
      <div class="stat"><b>1.8.9</b><span>VERSION</span></div>
    </div>
  </div>
</body>
</html>
