plugins {
    // Legacy Fabric's fork of fabric-loom, which is what supports 1.8.9.
    // 1.13.2 wraps fabric-loom 1.13, the newest that still runs on Gradle 8.
    id 'legacy-looming' version '1.13.2'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// ---------------------------------------------------------------------------
// mod/native — the Ultralight JNI binding, owned by another agent
// (CONTRACTS.md). Its Java-facing API compiles into this JAR from native/java;
// we never build its C++ side.
//
// PVP_ARCHITECTURE §4 names the binding's package `dev.void.ultralight`, which
// cannot exist: `void` is a Java keyword and is illegal as a package-name
// segment. Both owners renamed the one illegal segment — the binding is
// `dev.voidclient.ultralight`, this mod is `dev.voidpvp.client` — and both
// names are now settled, so `dev.voidpvp.client.ui.UltralightWebView` imports
// the binding directly. A signature change there is a compile error here,
// which is the point.
//
// The NullWebView fallback is unaffected: it triggers on LinkageError at
// runtime (no natives for this platform, or no binding classes at all), not on
// a missing source directory. Building without native/java is still possible
// and still yields a JAR that runs with the in-game UI disabled — it just also
// warns, because that JAR is not shippable.
// ---------------------------------------------------------------------------
def nativeJavaDir = file('native/java')

sourceSets {
    main {
        java {
            if (nativeJavaDir.exists()) {
                srcDir nativeJavaDir
            }
        }
    }
}

gradle.projectsEvaluated {
    if (!nativeJavaDir.exists()) {
        logger.warn('void-client: native/java is missing, so the Ultralight binding is not '
                + 'in this JAR. It builds and runs, with the in-game UI disabled '
                + '(NullWebView). Not a shippable artifact.')
    }
}

// ---------------------------------------------------------------------------
// Per-OS JARs (PVP_ARCHITECTURE §13)
//
// The Ultralight natives are ~21 MB per platform and 77 MB for all three,
// measured in mod/native/README.md, against the ~25 MB §13 budgeted. So the
// natives never go in the base JAR: each staged `natives/<os>-<arch>/` tree
// produces its own `void-client-<version>-<os>-<arch>.jar`, and `void-core`
// picks one at prepare time (install::ModPlatform).
//
// This repackages the already-remapped JAR rather than running the Loom remap
// per platform: the classes are identical across platforms, only the natives
// differ, so a second remap would cost minutes to produce the same bytes.
// ---------------------------------------------------------------------------
// Discovered, not enumerated, and the newest tree per platform wins.
//
// This used to be a fixed map of three paths — `build-win`, `build-macx64`, `build-macarm64`
// — plus a fallback to `build/natives/`. None of those three is what
// `native/scripts/build.sh --arch x86_64` writes: it writes `build-x86_64/natives/macos-x64`.
// So `build-macx64` was a **hand-made copy**, nothing kept it in step with the script, and it
// silently went four days stale. The jar it fed loaded, `Ultralight.load()` succeeded, and the
// failure surfaced only as an UnsatisfiedLinkError naming one JNI method the older dylib did
// not export — `in-game UI disabled`, in a log nobody reads, with a HUD that simply was not
// there. A build directory the build script never writes is a cache with no invalidation.
//
// So: every `native/build*/natives/<key>/` is a candidate, and the one with the newest
// `voidultralight.dylib` — the only library in the tree we actually compile — is the one that
// ships. A rebuild for any arch, in any of the script's directories, is picked up by the next
// `platformJars` with nothing to remember.
def nativeStages = [:]
file("$projectDir/native").listFiles()?.findAll {
    it.directory && it.name.startsWith('build')
}?.each { buildDir ->
    file("$buildDir/natives").listFiles()?.findAll { it.directory }?.each { stage ->
        def ours = file("$stage/voidultralight.dylib")
        if (!ours.file) ours = file("$stage/voidultralight.dll")
        if (!ours.file) ours = file("$stage/libvoidultralight.so")
        if (!ours.file) return
        def best = nativeStages[stage.name]
        if (best == null || ours.lastModified() > best.stamp) {
            nativeStages[stage.name] = [dir: stage, stamp: ours.lastModified()]
        }
    }
}
nativeStages = nativeStages.collectEntries { key, v -> [key, v.dir] }
nativeStages.each { key, dir ->
    logger.info("void-client: $key natives from ${dir}")
}

def platformJars = nativeStages.findAll { it.value.directory }.collect { key, dir ->
    tasks.register("platformJar${key.split('-').collect { it.capitalize() }.join()}", Jar) {
        group = 'build'
        description = "Repackages the remapped JAR with the $key Ultralight natives"
        dependsOn tasks.named('remapJar')
        archiveBaseName = project.archives_base_name
        archiveVersion = project.version
        archiveClassifier = key
        // The remapped classes, verbatim, plus this platform's natives tree.
        from { zipTree(tasks.named('remapJar').get().archiveFile) }
        from(dir) { into "natives/$key" }
        // Both trees can carry a natives manifest; the platform one wins.
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.register('platformJars') {
    group = 'build'
    description = 'Every per-OS void-client JAR that has staged natives'
    dependsOn platformJars
    doLast {
        if (platformJars.isEmpty()) {
            logger.lifecycle('void-client: no Ultralight natives staged, so no per-OS JARs. '
                    + 'Run mod/native/scripts/build.sh (or build.ps1), or fetch the CI '
                    + 'artifacts into mod/native/build-*/natives/.')
        } else {
            logger.lifecycle('void-client: per-OS JARs for '
                    + nativeStages.findAll { it.value.directory }.keySet().join(', '))
        }
    }
}

// `build` produces the JARs the launcher installs, not just the base one.
//
// It did not, and that is one of the three things that made `Play` run a three-day-old
// client. `platformJar*` are the only tasks that emit the classifier JARs `void-core`
// copies into `mods/`, and nothing depended on them — so `./gradlew build` refreshed
// `void-client-<version>.jar` while `void-client-<version>-macos-arm64.jar` sat beside it
// unchanged, with the same version in its name and no way to tell them apart. Rebuilding
// the mod and then launching it ran the old code, silently, and every measurement taken
// that way was of the wrong binary.
//
// The cost is one repackage per staged platform, ~29 MB each, and it is paid only when
// something actually changed: these are `Jar` tasks with proper inputs, so an unchanged
// rebuild is UP-TO-DATE and free. The fast inner loop is unaffected — `runClient` builds
// classes, not JARs, and never pulled `build` in.
//
// `assemble` is deliberately not the hook. It is what `runClient` and IDE sync reach for,
// and 60 MB of zip on a `classes` refresh is exactly the tax this must not levy.
tasks.named('build') { dependsOn 'platformJars' }

repositories {
    maven {
        name = 'Legacy Fabric'
        url = 'https://repo.legacyfabric.net/repository/legacyfabric/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.legacyfabric:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Both of these ship inside Minecraft 1.8.9, pinned to the exact versions
    // the game has on its classpath so we never compile against an API it
    // lacks. Neither is bundled into the JAR.
    implementation 'com.google.code.gson:gson:2.2.4'
    implementation 'io.netty:netty-all:4.0.23.Final'

    testImplementation 'com.google.code.gson:gson:2.2.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// Minecraft 1.8.9 runs on Java 8; everything we ship must be Java 8 bytecode.
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 8
}

java {
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }

    // The bridge shim's source of truth is assets/void/shim/, because
    // assets/void/ui/ is packages/ingame's build output and is gitignored.
    // The in-game bundle loads it from assets/void/ui/void-shim.js, so it is
    // published there too.
    from('src/main/resources/assets/void/shim/void-shim.js') {
        into 'assets/void/ui'
    }

    // Same reason for the design's webfaces: they are the mod's, but they are read
    // through the renderer's resource prefix, which is assets/void/ui/. The native
    // font loader serves them by family and weight — Ultralight never fetches an
    // @font-face itself, so a face that is not published here renders as Inter.
    //
    // The set is Outfit 300/400/500 and nothing else (design/quiet-cell-system.md
    // §2). It has to match kFaces in native/src/font_loader.cpp exactly; that file
    // carries the full contract and what goes wrong silently when it drifts.
    from('src/main/resources/assets/void/fonts') {
        into 'assets/void/ui/fonts'
    }

}

test {
    useJUnitPlatform()
    // The schemas are the contract; the tests round-trip every example in
    // them rather than a copy, so drift is a test failure (CONTRACTS.md).
    systemProperty 'void.schema.dir', file('../schema').absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
