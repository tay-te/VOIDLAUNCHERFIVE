# VOID Welkin: pack properties (Iris 1.11, Minecraft 26.3).
# The design and the bridge contract are in ../docs/DESIGN.md. Option lines live in lib/settings.glsl.

# ---- vanilla parts the pack keeps or drops ----
# Vanilla clouds ("on": Iris spells it fancy) until milestone M3, when the pack draws its own voxel clouds; then clouds=off.
oldLighting=false
separateAo=false
vignette=false
sun=true
moon=true
underwaterOverlay=true

# ---- shadows ----
# No shadow pass yet (M6). The far land never goes into a shadow map: Distant Horizons shadows stay off for good.
dhShadow.enabled=false

# ---- the VOID bridge (contract version 1, docs/DESIGN.md section 2) ----
# Gloam's data texture. Without Gloam, Iris binds the missing texture here; lib/void.glsl checks before reading.
customTexture.void_data=gloam:pack/data

# Smoothed copies of Gloam's uniforms. void_* names are Gloam's; the pack's own are welkin_*. Only declared when
# Gloam defines VOID_GLOAM, so a game without Gloam logs no unresolved uniforms.
#ifdef VOID_GLOAM
uniform.float.welkin_mistS=smooth(void_mist, 4, 4)
uniform.float.welkin_rainS=smooth(void_rain, 6, 6)
#endif

# ---- blending ----
# The far water is drawn by VOID LOD with whatever blend the pack asks for, and none is on otherwise.
blend.dh_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# The water marks (colortex3) replace what is there, unblended.
blend.dh_water.colortex3=off
blend.gbuffers_water.colortex3=off
# Self-lit programs write colortex2.x = 0 so deferred never lights them twice; that flag must not blend.
blend.gbuffers_basic.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex2=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_clouds.colortex2=off

# ---- VOID Welkin: options, profiles and screens (generated by tools/options.py)
# Replaces the skeleton's profile.*, screen*, sliders lines. Profiles list every option that differs
# between them, so a profile shows as selected exactly when all of those match.

profile.LOW = LIGHT_STEPS=4 MIST_SAMPLES=2 !FAR_TEXTURE FAR_TEXTURE_PIXELS=3
profile.MEDIUM = LIGHT_STEPS=5 MIST_SAMPLES=3 FAR_TEXTURE FAR_TEXTURE_PIXELS=2
profile.HIGH = LIGHT_STEPS=5 MIST_SAMPLES=4 FAR_TEXTURE FAR_TEXTURE_PIXELS=1

screen = <profile> <empty> [LIGHT] [AIR] [PLANTS] [FAR] [LOOK] <empty> [DEBUG]
screen.columns = 2
screen.LIGHT = sunPathRotation LIGHT_STEPS BLOCKLIGHT_STRENGTH HANDHELD_LIGHT EMISSIVE_BLOCKS
screen.LIGHT.columns = 2
screen.AIR = VALLEY_MIST MIST_THICKNESS MIST_SAMPLES
screen.AIR.columns = 2
screen.PLANTS = WAVING_LEAVES WAVING_PLANTS WAVING_WATER_PLANTS WAVE_STRENGTH
screen.PLANTS.columns = 2
screen.FAR = FAR_TEXTURE FAR_TEXTURE_PIXELS FAR_FADE
screen.FAR.columns = 2
screen.LOOK = COLOR_STEPS DITHER
screen.LOOK.columns = 2
screen.DEBUG = DEBUG_VIEW BRIDGE_MODE MIST_FORCE DEBUG_JOIN
screen.DEBUG.columns = 1

sliders = sunPathRotation LIGHT_STEPS BLOCKLIGHT_STRENGTH MIST_THICKNESS MIST_SAMPLES WAVE_STRENGTH FAR_TEXTURE_PIXELS COLOR_STEPS DEBUG_VIEW BRIDGE_MODE MIST_FORCE

# Vanilla clouds until the voxel clouds module (M3) is merged.
clouds=fancy
