# VOID Welkin: pack properties (Iris 1.11, Minecraft 26.3).
# The design and the bridge contract are in ../docs/DESIGN.md. Option lines live in lib/settings.glsl.

# ---- vanilla parts the pack keeps or drops ----
# Vanilla clouds only with CLOUDS off: the pack draws its own voxel clouds (M3; the clouds= lines are in the generated
# block below).
oldLighting=false
# Minecraft's corner shading comes apart from the vertex colour (its alpha), so the light ramp lays it on the sky's
# fill and the torch light only, never on the sun (lib/light.glsl LIGHT_AO_POW).
separateAo=true
vignette=false
underwaterOverlay=true
# The sun and the moon are the sky dome's pixel art (gbuffers_skybasic, lib/sky/celestial.glsl) unless SKY_PIXEL_SUN is
# off; then vanilla's textured quads, unlit.
#ifdef SKY_PIXEL_SUN
sun=false
moon=false
#else
sun=true
moon=true
#endif
# Vanilla's stars: gbuffers_skybasic discards them and draws its own (Iris 1.11 reads this key but does not act on it).
stars=false

# ---- the sky table ----
# prepare draws 64x32 texels into colortex5 once a frame (lib/sky/table.glsl has the layout): the dome's colour points,
# the light ramp's sun, moon and ambient light, horizon colours per haze kind, cloud faces and the sprite palettes.
size.buffer.colortex5=64 32
# Lightning: 1 while Iris sees a bolt, falling back over about half a second; the sky and the light follow it smoothly
# (lib/sky/inputs.glsl), and Gloam's storm gates it. Iris's own uniform only, so no VOID_GLOAM guard.
uniform.float.welkin_flash=smooth(if(lightningBoltPosition.w > 0.5, 1.0, 0.0), 0.02, 0.45)

# ---- the cloud map (M3) ----
# prepare1 works every cloud cell out into colortex7 (raw), prepare2 adds edges and blocks into colortex8 (finished):
# 160 cells across, one square per ring, 8 rings stacked (lib/clouds/map.glsl).
size.buffer.colortex7=160 1280
size.buffer.colortex8=160 1280

# ---- the ambient occlusion ----
# program/deferred_ao.glsl (run as deferred) works the raw term out at half resolution into colortex9;
# program/deferred_aoresolve.glsl (run as deferred1) resolves it at half resolution into colortex12, which the light
# takes up to full resolution (lib/ao.glsl, lib/denoise.glsl; the balance step, 2026-10-13).
size.buffer.colortex9=0.5 0.5
size.buffer.colortex12=0.5 0.5
# workstream A: the terrain's light (lib/terrain.glsl), one texel a cell of Gloam's near land tile, two rows of tiles
size.buffer.colortex15=256 512

# ---- shadows ----
# The near shadow map (program/shadow.glsl, lib/shadow.glsl): the chunks inside shadowDistance only, overworld only, off
# with SHADOWS (LOW); the program switches are in the generated block below. The far land never goes into a shadow map:
# Distant Horizons shadows stay off for good; past the map and on the LOD the light pass finds the far shadows on screen
# (lib/farshadow.glsl, FAR_SHADOWS).
dhShadow.enabled=false
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true

# ---- the VOID bridge (contract version 1, docs/DESIGN.md section 2) ----
# Gloam's data texture. Without Gloam, Iris binds the missing texture here; lib/void.glsl checks before reading.
customTexture.void_data=gloam:pack/data

# Smoothed copies of Gloam's uniforms. void_* names are Gloam's; the pack's own are welkin_*. Only declared when
# Gloam defines VOID_GLOAM, so a game without Gloam logs no unresolved uniforms.
#ifdef VOID_GLOAM
uniform.float.welkin_mistS=smooth(void_mist, 4, 4)
uniform.float.welkin_rainS=smooth(void_rain, 6, 6)
#endif

# ---- blending ----
# The far water is drawn by VOID LOD with whatever blend the pack asks for, and none is on otherwise.
blend.dh_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# The water marks (colortex3) replace what is there, unblended.
blend.dh_water.colortex3=off
blend.gbuffers_water.colortex3=off
# Self-lit programs write colortex2.x = 0 so deferred never lights them twice; that flag must not blend.
blend.gbuffers_basic.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex2=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_clouds.colortex2=off

# ---- VOID Welkin: options, profiles and screens (generated by tools/options.py)
# Replaces the skeleton's profile.*, screen*, sliders lines. Profiles list every option that differs
# between them, so a profile shows as selected exactly when all of those match.

profile.LOW = !SHADOWS shadowMapResolution=1024 shadowDistance=96.0 !FAR_SHADOWS !AMBIENT_OCCLUSION HAZE_SAMPLES=2 MIST_SAMPLES=2 CLOUD_QUALITY=1 CLOUD_SHADOWS=0 !WET_PUDDLES WET_PUDDLE_REACH=48.0 !FAR_TEXTURE FAR_TEXTURE_PIXELS=3 !TERRAIN_SHADOWS AO_QUALITY=1
profile.MEDIUM = SHADOWS shadowMapResolution=2048 shadowDistance=128.0 FAR_SHADOWS AMBIENT_OCCLUSION HAZE_SAMPLES=3 MIST_SAMPLES=3 CLOUD_QUALITY=2 CLOUD_SHADOWS=2 WET_PUDDLES WET_PUDDLE_REACH=96.0 FAR_TEXTURE FAR_TEXTURE_PIXELS=2 TERRAIN_SHADOWS TERRAIN_SLOPE=300 AO_QUALITY=1
profile.HIGH = SHADOWS shadowMapResolution=3072 shadowDistance=192.0 FAR_SHADOWS AMBIENT_OCCLUSION HAZE_SAMPLES=4 MIST_SAMPLES=4 CLOUD_QUALITY=3 CLOUD_SHADOWS=3 WET_PUDDLES WET_PUDDLE_REACH=128.0 FAR_TEXTURE FAR_TEXTURE_PIXELS=1 TERRAIN_SHADOWS TERRAIN_SLOPE=300 AO_QUALITY=2

screen = <profile> <empty> [LIGHT] [SKY] [AIR] [CLOUDS] [WEATHER] [PLANTS] [FAR] [LOOK] <empty> [DEBUG]
screen.columns = 2
screen.LIGHT = SHADOWS shadowMapResolution shadowDistance SHADOW_SOFTNESS FAR_SHADOWS AMBIENT_OCCLUSION sunPathRotation LIGHT_BANDS BLOCKLIGHT_STRENGTH HANDHELD_LIGHT EMISSIVE_BLOCKS CONTACT_SHADOWS SHADOW_LONG_FADE TEMPORAL_LIGHT SHADOW_FILTER TERRAIN_SHADOWS TERRAIN_SLOPE AO_STRENGTH AO_QUALITY AO_SUN_FAR FAR_LEAF_FORM
screen.LIGHT.columns = 2
screen.SKY = SKY_PIXEL_SUN SUN_SIZE MOON_SIZE SKY_ART_PIXEL SKY_TEXELS STAR_DENSITY STAR_TWINKLE SUN_HALO NIGHT_SKYLIGHT
screen.SKY.columns = 2
screen.AIR = HAZE_ENABLED HAZE_STRENGTH HAZE_NEAR_CLEAR HAZE_SAMPLES HAZE_RAIN HAZE_ON_SKY HAZE_SEA_LEVEL VALLEY_MIST MIST_THICKNESS MIST_SAMPLES
screen.AIR.columns = 2
screen.CLOUDS = CLOUDS CLOUD_QUALITY CLOUD_SHADOWS CLOUD_FAIR
screen.CLOUDS.columns = 2
screen.WEATHER = WET_ENABLED WET_PUDDLES WET_PUDDLE_REACH
screen.WEATHER.columns = 2
screen.PLANTS = WAVING_LEAVES WAVING_PLANTS WAVING_WATER_PLANTS WAVE_STRENGTH
screen.PLANTS.columns = 2
screen.FAR = FAR_TEXTURE FAR_TEXTURE_PIXELS FAR_FADE
screen.FAR.columns = 2
screen.LOOK = SOFT_BANDS
screen.LOOK.columns = 2
screen.DEBUG = DEBUG_VIEW BRIDGE_MODE MIST_FORCE DEBUG_JOIN HAZE_DEBUG SKY_DEBUG
screen.DEBUG.columns = 1

sliders = shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation LIGHT_BANDS BLOCKLIGHT_STRENGTH SUN_SIZE MOON_SIZE SKY_ART_PIXEL SKY_TEXELS STAR_DENSITY NIGHT_SKYLIGHT HAZE_STRENGTH HAZE_SAMPLES HAZE_RAIN HAZE_SEA_LEVEL MIST_THICKNESS MIST_SAMPLES CLOUD_QUALITY CLOUD_SHADOWS CLOUD_FAIR WET_PUDDLE_REACH WAVE_STRENGTH FAR_TEXTURE_PIXELS SOFT_BANDS DEBUG_VIEW BRIDGE_MODE MIST_FORCE HAZE_DEBUG SKY_DEBUG SHADOW_LONG_FADE TERRAIN_SLOPE AO_STRENGTH AO_SUN_FAR FAR_LEAF_FORM HAZE_NEAR_CLEAR

# The shadow pass only runs with shadows on (an option, not just a profile, so a custom mix works), and only
# in the overworld: the Nether has no sun, the End's light is flat (wave-2 cross-check).
program.world0/shadow.enabled = SHADOWS
program.world-1/shadow.enabled = false
program.world1/shadow.enabled = false
program.world0/shadow_solid.enabled = SHADOWS
program.world-1/shadow_solid.enabled = false
program.world1/shadow_solid.enabled = false

# The ambient occlusion's passes (program/deferred_ao.glsl and deferred_aoresolve.glsl, run as deferred and deferred1)
# only with it on.
program.world0/deferred.enabled = AMBIENT_OCCLUSION
program.world-1/deferred.enabled = AMBIENT_OCCLUSION
program.world1/deferred.enabled = AMBIENT_OCCLUSION
program.world0/deferred1.enabled = AMBIENT_OCCLUSION
program.world-1/deferred1.enabled = AMBIENT_OCCLUSION
program.world1/deferred1.enabled = AMBIENT_OCCLUSION

# Vanilla clouds only when the pack's own are off (M3). Replaces the skeleton's clouds=fancy line.
#ifdef CLOUDS
clouds=off
#else
clouds=fancy
#endif
# The cloud map passes and the clouds pass (prepare1, prepare2, composite) run in the overworld only.
program.world0/prepare1.enabled = CLOUDS
program.world0/prepare2.enabled = CLOUDS
program.world0/composite.enabled = CLOUDS
program.world-1/prepare1.enabled = false
program.world-1/prepare2.enabled = false
program.world-1/composite.enabled = false
program.world1/prepare1.enabled = false
program.world1/prepare2.enabled = false
program.world1/composite.enabled = false

# ---- Light: shadows (A). The shadow buffers' passes (program/deferred_shadow.glsl as deferred2, program/
# deferred_resolve.glsl as deferred3; the light is deferred4) only with the shadow map, in the overworld: without it the
# light pass works the reach out itself (lib/shadowfetch.glsl).
program.world0/deferred2.enabled = SHADOWS
program.world-1/deferred2.enabled = false
program.world1/deferred2.enabled = false
program.world0/deferred3.enabled = SHADOWS
program.world-1/deferred3.enabled = false
program.world1/deferred3.enabled = false
program.world0/prepare3.enabled = TERRAIN_SHADOWS
program.world-1/prepare3.enabled = false
program.world1/prepare3.enabled = false
