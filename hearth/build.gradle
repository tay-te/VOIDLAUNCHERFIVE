plugins {
	// 26.x ships unobfuscated, so there is no mappings line: the code is written against Mojang's own
	// names, and Loom has nothing to remap.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'void-hearth'
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hearth" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The Earth terrain model, read directly when Expanse is present (world/ExpanseTerrain). In the dev runs
	// Expanse is on the classpath too, so settlements grow on real Earth terrain among the Expanse biomes.
	compileOnly 'dev.voidmc:void-expanse'
	localRuntime 'dev.voidmc:void-expanse'

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// VOID Atlas, the map: an optional partner, compiled against the artifact Atlas publishes to Maven local
// (dev.voidmc:void-atlas, from Atlas's own `./gradlew publishToMavenLocal`; it carries the client API too). Hearth never
// builds inside an Atlas checkout. When that artifact is there (or -Patlas=true), the "atlas" source set (src/atlas: the
// map plugin, the only code that names Atlas types) is compiled against it and shipped in the jar; without it (or with
// -Patlas=false) the source set does not exist, the plugin's entrypoint line is left out of fabric.mod.json, and Hearth
// builds and runs as before. -Patlas.version= picks the published version; -Patlas.run=true loads Atlas in the dev runs.
def atlasVersion = (findProperty('atlas.version') ?: '0.2.0').toString()
def atlasFlag = findProperty('atlas')?.toString()
def hasAtlas = atlasFlag != null ? atlasFlag.toBoolean()
	: new File(System.getProperty('user.home'), ".m2/repository/dev/voidmc/void-atlas/${atlasVersion}/void-atlas-${atlasVersion}.jar").isFile()
if (hasAtlas) {
	repositories {
		mavenLocal {
			content { includeModule 'dev.voidmc', 'void-atlas' }
		}
	}
	sourceSets {
		atlas {
			compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
			runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
		}
	}
	loom.mods.named('hearth').configure { it.sourceSet sourceSets.atlas }
	dependencies {
		atlasCompileOnly("dev.voidmc:void-atlas:${atlasVersion}") { transitive = false }
		if ((findProperty('atlas.run') ?: 'false').toString().toBoolean()) {
			localRuntime("dev.voidmc:void-atlas:${atlasVersion}") { transitive = false }
		}
	}
	tasks.named('jar') { from sourceSets.atlas.output }
	tasks.withType(Jar).matching { it.name == 'sourcesJar' }.configureEach { from sourceSets.atlas.allSource }
}

// Each module keeps its own lang fragment (assets/hearth/lang/en_us/<module>.json) so modules never edit one shared
// file; they are merged into the en_us.json the game reads. A key defined twice with different text fails the build.
def langFragments = file('src/main/resources/assets/hearth/lang/en_us')
def mergedLang = layout.buildDirectory.dir('generated/lang')
tasks.register('mergeLang') {
	inputs.files(fileTree(langFragments)).withPropertyName('fragments')
	outputs.dir(mergedLang)
	doLast {
		def merged = new TreeMap()
		def owners = [:]
		(langFragments.listFiles() ?: []).findAll { it.name.endsWith('.json') }.sort { it.name }.each { f ->
			new groovy.json.JsonSlurper().parse(f, 'UTF-8').each { k, v ->
				if (merged.containsKey(k) && merged[k] != v) {
					throw new GradleException("lang key ${k} is defined in both ${owners[k]} and ${f.name}")
				}
				merged[k] = v
				owners[k] = f.name
			}
		}
		def out = mergedLang.get().file('assets/hearth/lang/en_us.json').asFile
		out.parentFile.mkdirs()
		out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)), 'UTF-8')
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	dependsOn 'mergeLang'
	from(mergedLang)
	exclude 'assets/hearth/lang/en_us/**'

	inputs.property "atlas", hasAtlas
	filesMatching("fabric.mod.json") {
		expand "version": version
		if (!hasAtlas) {
			// the map plugin was not compiled: drop its entrypoint line (kept on a line of its own for this)
			filter { String line -> line.contains('dev.voidmc.hearth.client.map.atlas.') ? null : line }
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// every building family's tests in one JVM, each holding a blueprint service and its cache: room for them, and a
	// fresh JVM every hundred test classes so their caches do not pile up
	maxHeapSize = '3g'
	forkEvery = 100
	testLogging {
		events 'failed'
		exceptionFormat 'full'
		showStandardStreams = true
	}
}

// The gametest source set holds the client tour (in-game screenshots of settlements) and the offline preview tools.
// None of it ships in the mod.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "hearth-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = false
	}
}

// Renders blueprints to isometric PNGs without starting the game (vanilla blocks; Expanse blocks fall back).
//   ./gradlew blueprintPreview -Parchetype=hearth:house/cottage -Pstyle=temperate -Pseeds=4 -Pterrain=slope
tasks.register('blueprintPreview', JavaExec) {
	group = 'hearth'
	description = 'Renders blueprints to build/previews/*.png'
	classpath = sourceSets.gametest.runtimeClasspath
	mainClass = 'dev.voidmc.hearth.gametest.BlueprintPreview'
	jvmArgs '-Djava.awt.headless=true', '-Xmx3g'
	args = [
		project.findProperty('archetype') ?: 'all',
		project.findProperty('style') ?: 'all',
		project.findProperty('seeds') ?: '3',
		project.findProperty('terrain') ?: 'flat',
		layout.buildDirectory.dir('previews').get().asFile.path
	]
}

// The building families' previews as tasks of this build (agePreview, ageTown, craftPreview, deepPreview, deepTown,
// extractionPreview, industryPreview, socialPreview, stationPreview, streetPreview...): each docs/buildings/*_preview.gradle
// (and townhome_street.gradle) is applied here as it would be as an init script; one passed with -I registers its own
// tasks and is skipped here. See the family pages in docs/buildings/ for their arguments.
def familyInitScripts = gradle.startParameter.initScripts.collect { it.name }
fileTree('docs/buildings') { include '*_preview.gradle', 'townhome_street.gradle' }.files.sort { it.name }.each { f ->
	if (!familyInitScripts.contains(f.name)) {
		apply from: f, to: gradle
	}
}

// What blueprints cost to draw and compile, per family (the light pass, shapes, campaigns), without the game.
//   ./gradlew blueprintBench -Parchetype=all -Pstyle=all -Pterrain=slope
tasks.register('blueprintBench', JavaExec) {
	group = 'hearth'
	description = 'Times drawing and compiling every catalogue blueprint, per family'
	classpath = sourceSets.gametest.runtimeClasspath
	mainClass = 'dev.voidmc.hearth.gametest.perf.BlueprintBench'
	jvmArgs '-Djava.awt.headless=true', '-Xmx3g'
	args = [
		project.findProperty('archetype') ?: 'all',
		project.findProperty('style') ?: 'all',
		project.findProperty('terrain') ?: 'slope'
	]
}

// Plans a settlement on synthetic or generator terrain, grows it for some days, and renders it (plan + isometric).
//   ./gradlew settlementPreview -Pculture=temperate -Pdays=200 -Pterrain=hills -Pseed=1
tasks.register('settlementPreview', JavaExec) {
	group = 'hearth'
	description = 'Plans and grows a settlement offline and renders it to build/previews/settlement_*.png'
	classpath = sourceSets.gametest.runtimeClasspath
	mainClass = 'dev.voidmc.hearth.gametest.SettlementPreview'
	jvmArgs '-Djava.awt.headless=true', '-Xmx4g'
	args = [
		project.findProperty('culture') ?: 'temperate',
		project.findProperty('days') ?: '120',
		project.findProperty('terrain') ?: 'hills',
		project.findProperty('seed') ?: '1',
		layout.buildDirectory.dir('previews').get().asFile.path
	]
}
