plugins {
	// 26.x ships unobfuscated, so there is no mappings line: the code is written against Mojang's own names, and
	// Loom has nothing to remap.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'void-atlas'
}

repositories {
	mavenCentral()
}

// -Patlas.withExpanse=true: the dev runs and game tests also load ../expanse (see settings.gradle).
def withExpanse = (findProperty('atlas.withExpanse') ?: 'false').toString().toBoolean()

loom {
	// The pure map logic (palette, tiles, stores, the marker registry) lives in main and is unit tested without the
	// game; everything that touches the client (screens, HUD, textures, chunk reading) lives in client.
	splitEnvironmentSourceSets()

	mods {
		"atlas" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	if (withExpanse) {
		// Only for the dev runs: Atlas reads whatever world it is in, it never calls Expanse.
		localRuntime 'dev.voidmc:void-expanse'
	}

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// The Mod Menu API stand-ins are only for compiling ModMenuCompat; the real ones come with Mod Menu, if installed.
tasks.withType(Jar).configureEach {
	exclude 'com/terraformersmc/**'
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// golden images that fail are written here, next to what they should have been
	systemProperty 'atlas.test.out', layout.buildDirectory.dir('test-images').get().asFile.absolutePath
	// ./gradlew test -Patlas.golden.update=true rewrites the golden images after a deliberate change of look
	systemProperty 'atlas.golden.update', (findProperty('atlas.golden.update') ?: 'false').toString()
	systemProperty 'atlas.golden.dir', file('src/test/resources/golden').absolutePath
	outputs.upToDateWhen { false }
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

// ---------------------------------------------------------------------------------------------------------------
// Client game tests: a screenshot tour and a performance gate, each in its own run so they can be started alone.
//   ./gradlew atlasTour                      screenshots for review          -> build/tour/
//   ./gradlew atlasPerf -Pbackend=opengl     timings, fails over budget      -> build/perf/opengl.json, docs/PERF.md
//   ./gradlew atlasPerf -Pbackend=vulkan
// Add -Patlas.withExpanse=true to fly over an Expanse Earth world instead of a vanilla one.
// ---------------------------------------------------------------------------------------------------------------
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "atlas-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = false
	}
}

def backend = (findProperty('backend') ?: 'opengl').toString()
// -Patlas.baseline=true: the perf flight with Atlas doing nothing (the game alone), into build/perf-baseline/
def baseline = (findProperty('atlas.baseline') ?: 'false').toString() == 'true'
def testWidth = (findProperty('atlas.test.width') ?: '1920').toString()
def testHeight = (findProperty('atlas.test.height') ?: '1080').toString()
def passThrough = ['atlas.test.seed', 'atlas.test.settle', 'atlas.test.only', 'atlas.test.distance', 'atlas.test.frames',
				   'atlas.test.watchdogMinutes', 'atlas.logStats']

loom {
	runs {
		configureEach {
			passThrough.each { key ->
				if (project.hasProperty(key)) {
					property key, project.property(key).toString()
				}
			}
		}
		atlasTour {
			inherit clientGameTest
			configName = 'Atlas screenshot tour'
			runDir = 'build/run/atlasTour'
			property 'atlas.test', 'tour'
			property 'atlas.dumpLooks', 'true'
			property 'atlas.test.out', file('build/tour').absolutePath
			property 'atlas.test.withExpanse', withExpanse.toString()
			programArgs '--width', testWidth, '--height', testHeight, '--graphicsBackend', backend
			vmArgs '-Xmx3G'
		}
		atlasSoak {
			inherit clientGameTest
			configName = 'Atlas soak and world-switch test'
			runDir = 'build/run/atlasSoak'
			property 'atlas.test', 'soak'
			property 'atlas.test.out', file('build/soak/soak.json').absolutePath
			property 'atlas.soak.seconds', (findProperty('atlas.soak.seconds') ?: '240').toString()
			property 'atlas.test.watchdogMinutes', '40'
			programArgs '--width', testWidth, '--height', testHeight, '--graphicsBackend', backend
			vmArgs '-Xmx3G'
		}
		atlasPerf {
			inherit clientGameTest
			configName = 'Atlas performance gate'
			runDir = 'build/run/atlasPerf'
			property 'atlas.test', 'perf'
			property 'atlas.test.backend', backend
			property 'atlas.test.out', file(baseline ? "build/perf-baseline/${backend}.json" : "build/perf/${backend}.json").absolutePath
			property 'atlas.baseline', baseline.toString()
			property 'atlas.test.withExpanse', withExpanse.toString()
			programArgs '--width', testWidth, '--height', testHeight, '--graphicsBackend', backend
			// every pause of the whole JVM (GC or not) with its time to reach it, for a long frame that is no phase's fault
			vmArgs '-Xmx3G', '-Xlog:safepoint=info,gc=info:file=safepoints.log:uptime,tags'
		}
	}
}

// Every tour and perf run makes new worlds; the last run's worlds and maps are deleted first, so they never pile up
// (a few hundred MB each).
['runAtlasTour': 'atlasTour', 'runAtlasPerf': 'atlasPerf', 'runAtlasSoak': 'atlasSoak'].each { task, dir ->
	tasks.matching { it.name == task }.configureEach {
		doFirst {
			delete file("build/run/${dir}/saves"), file("build/run/${dir}/atlas")
		}
	}
}

tasks.register('atlasSoak') {
	group = 'atlas'
	description = 'Plays for a long while: two dedicated servers behind one address, many dimension changes; fails on mixed worlds, memory growth or an Atlas hitch'
	dependsOn 'runAtlasSoak'
	doLast {
		def json = file('build/soak/soak.json')
		if (!json.isFile()) {
			throw new GradleException('The soak test wrote no results to build/soak/soak.json')
		}
		def r = new groovy.json.JsonSlurper().parse(json)
		r.notes.each { println "Atlas soak: ${it}" }
		if (!r.passed) {
			throw new GradleException('Atlas soak failed: ' + r.failures.join('; '))
		}
		println "Atlas soak: passed (worst Atlas frame ${r.worstAtlasFrameMs} ms, heap ${r.heapMb} MB, grew ${r.heapGrowthMb} MB)"
	}
}

tasks.register('atlasTour') {
	group = 'atlas'
	description = 'Flies over a world, lets Atlas build its tiles and photographs the map, minimap and cards into build/tour'
	dependsOn 'runAtlasTour'
	doLast {
		def shots = file('build/tour').listFiles()?.findAll { it.name.endsWith('.png') } ?: []
		if (shots.isEmpty()) {
			throw new GradleException('The tour wrote no screenshots to build/tour')
		}
		println "Atlas tour: ${shots.size()} screenshots in ${file('build/tour')}"
	}
}

// The budgets the performance gate holds Atlas to (see docs/PERF.md).
def budgets = [
	minimapAvgMs     : 0.30,  // minimap extract cost, average per frame while flying
	mapAvgFrameMs    : 4.0,   // whole frame with the map open, panning and zooming (>= 250 fps)
	mapP99FrameMs    : 8.0,
	ingestMaxFrameMs : 1.0,   // client-thread time spent on chunk ingest in any one frame
	hitchMs          : 33.0,  // no frame longer than this while panning, zooming or flying
	underAvgFrameMs  : 4.0,   // the underground map, panning and zooming
	underP99FrameMs  : 8.0,
	detectMsPerChunk : 0.5,   // structure detection per chunk, on the workers
	revealMsPerWalk  : 20.0,  // one underground reveal round the player, on the workers (at most one at a time)
	beamsAvgMs       : 0.15,  // the waypoint beams and labels in the world, per frame while flying (48 waypoints)
	radarAvgMs       : 0.10   // the minimap's radar, per frame while flying
]

tasks.register('atlasPerf') {
	group = 'atlas'
	description = 'Runs the scripted pan/zoom and minimap flight, writes build/perf/<backend>.json and docs/PERF.md, fails over budget'
	dependsOn 'runAtlasPerf'
	doLast {
		if (baseline) {
			def b = new groovy.json.JsonSlurper().parse(file("build/perf-baseline/${backend}.json"))
			println "Vanilla baseline (${backend}), Atlas idle: flight avg ${b.flight.avgFrameMs} ms, p99 ${b.flight.p99FrameMs} ms, worst ${b.flight.maxFrameMs} ms"
			return
		}
		def json = file("build/perf/${backend}.json")
		if (!json.isFile()) {
			throw new GradleException("The perf run wrote no results to ${json}")
		}
		def r = new groovy.json.JsonSlurper().parse(json)
		def failures = []
		if (r.minimap.avgMs > budgets.minimapAvgMs) failures << "minimap ${r.minimap.avgMs} ms/frame > ${budgets.minimapAvgMs}"
		if (r.map.avgFrameMs > budgets.mapAvgFrameMs) failures << "map screen avg frame ${r.map.avgFrameMs} ms > ${budgets.mapAvgFrameMs}"
		if (r.map.p99FrameMs > budgets.mapP99FrameMs) failures << "map screen p99 frame ${r.map.p99FrameMs} ms > ${budgets.mapP99FrameMs}"
		if (r.ingest.maxFrameMs > budgets.ingestMaxFrameMs) failures << "chunk ingest ${r.ingest.maxFrameMs} ms in one frame > ${budgets.ingestMaxFrameMs}"
		if (r.map.maxFrameMs > budgets.hitchMs) failures << "hitch while panning/zooming: ${r.map.maxFrameMs} ms > ${budgets.hitchMs}"
		if (r.flight.maxFrameMs > budgets.hitchMs) failures << "hitch while flying: ${r.flight.maxFrameMs} ms > ${budgets.hitchMs}"
		if (r.underMap.avgFrameMs > budgets.underAvgFrameMs) failures << "underground map avg frame ${r.underMap.avgFrameMs} ms > ${budgets.underAvgFrameMs}"
		if (r.underMap.p99FrameMs > budgets.underP99FrameMs) failures << "underground map p99 frame ${r.underMap.p99FrameMs} ms > ${budgets.underP99FrameMs}"
		if (r.underMap.maxFrameMs > budgets.hitchMs) failures << "hitch on the underground map: ${r.underMap.maxFrameMs} ms > ${budgets.hitchMs}"
		if (r.detect.msPerChunk > budgets.detectMsPerChunk) failures << "structure detection ${r.detect.msPerChunk} ms/chunk > ${budgets.detectMsPerChunk}"
		if (r.beams && r.beams.avgMs > budgets.beamsAvgMs) failures << "waypoint beams ${r.beams.avgMs} ms/frame > ${budgets.beamsAvgMs}"
		if (r.radar && r.radar.avgMs > budgets.radarAvgMs) failures << "radar ${r.radar.avgMs} ms/frame > ${budgets.radarAvgMs}"
		if (r.reveal.walks > 0 && r.reveal.msPerWalk > budgets.revealMsPerWalk) failures << "underground reveal ${r.reveal.msPerWalk} ms/walk > ${budgets.revealMsPerWalk}"
		updatePerfDoc(file('docs/PERF.md'), file('build/perf'), budgets)
		if (!failures.isEmpty()) {
			throw new GradleException("Atlas is over budget on ${backend}:\n  " + failures.join('\n  '))
		}
		println "Atlas perf (${backend}): within budget. map ${r.map.avgFps} fps avg (${r.map.avgFrameMs} ms, p99 ${r.map.p99FrameMs} ms), " +
			"minimap ${r.minimap.avgMs} ms, ingest max ${r.ingest.maxFrameMs} ms/frame"
	}
}

/** Rewrites the generated table in docs/PERF.md (between the perf:begin and perf:end markers) from every result file. */
static void updatePerfDoc(File doc, File dir, Map budgets) {
	def results = (dir.listFiles() ?: []).findAll { it.name.endsWith('.json') }.sort { it.name }.collect { new groovy.json.JsonSlurper().parse(it) }
	if (results.isEmpty() || !doc.isFile()) {
		return
	}
	def rows = []
	rows << '| | ' + results.collect { "${it.backend}" }.join(' | ') + ' | budget |'
	rows << '|---|' + results.collect { '---' }.join('|') + '|---|'
	def row = { String label, Closure value, String budget -> rows << "| ${label} | " + results.collect { value(it) }.join(' | ') + " | ${budget} |" }
	row('Map screen, panning/zooming: avg frame', { "${it.map.avgFrameMs} ms (${it.map.avgFps} fps)" }, "≤ ${budgets.mapAvgFrameMs} ms")
	row('Map screen: p99 / worst frame', { "${it.map.p99FrameMs} / ${it.map.maxFrameMs} ms" }, "≤ ${budgets.mapP99FrameMs} / ${budgets.hitchMs} ms")
	row('Map screen: Atlas CPU per frame', { "${it.map.atlasAvgMs} ms" }, '—')
	row('Map screen: tiles drawn / uploaded', { "${it.map.tilesDrawnAvg} avg / ${it.map.uploads} uploads (${it.map.uploadMb} MB)" }, '—')
	row('Flying, minimap on: avg / worst frame', { "${it.flight.avgFrameMs} ms (${it.flight.avgFps} fps) / ${it.flight.maxFrameMs} ms" }, "worst ≤ ${budgets.hitchMs} ms")
	row('Minimap cost per frame (avg / max)', { "${it.minimap.avgMs} / ${it.minimap.maxMs} ms" }, "avg ≤ ${budgets.minimapAvgMs} ms")
	row('Waypoint beams (48 waypoints): avg / p99 / max per frame', { it.beams ? "${it.beams.avgMs} / ${it.beams.p99Ms} / ${it.beams.maxMs} ms" : '—' }, "avg ≤ ${budgets.beamsAvgMs} ms")
	row('Minimap radar: avg / p99 / max per frame', { it.radar ? "${it.radar.avgMs} / ${it.radar.p99Ms} / ${it.radar.maxMs} ms" : '—' }, "avg ≤ ${budgets.radarAvgMs} ms")
	row('Chunk ingest, client thread: max per frame', { "${it.ingest.maxFrameMs} ms" }, "≤ ${budgets.ingestMaxFrameMs} ms")
	row('Chunk scan (worker): per chunk', { "${it.ingest.scanMsPerChunk} ms (${it.ingest.chunks} chunks)" }, '—')
	row('Tile uploads while flying', { "${it.flight.uploads} (${it.flight.uploadMb} MB)" }, '—')
	row('Underground map, panning/zooming: avg frame', { it.underMap ? "${it.underMap.avgFrameMs} ms (${it.underMap.avgFps} fps)" : '—' }, "≤ ${budgets.underAvgFrameMs} ms")
	row('Underground map: p99 / worst frame', { it.underMap ? "${it.underMap.p99FrameMs} / ${it.underMap.maxFrameMs} ms" : '—' }, "≤ ${budgets.underP99FrameMs} / ${budgets.hitchMs} ms")
	row('Structure detection (worker): per chunk', { it.detect ? "${it.detect.msPerChunk} ms (${it.detect.chunks} chunks)" : '—' }, "≤ ${budgets.detectMsPerChunk} ms")
	row('Underground reveal (worker): per walk', { it.reveal ? "${it.reveal.msPerWalk} ms (${it.reveal.walks} walks, ${it.reveal.openPerWalk} open blocks)" : '—' }, "≤ ${budgets.revealMsPerWalk} ms")
	row('Worst minimap frame: setup / tiles / markers / rest', { it.minimapSpike ? "${it.minimapSpike.setupMs} / ${it.minimapSpike.tilesMs} / ${it.minimapSpike.markersMs} / ${it.minimapSpike.restMs} ms" : '—' }, '—')
	row('Machine', { "${it.gpu}" }, '')
	def text = doc.getText('UTF-8')
	def begin = '<!-- perf:begin -->'
	def end = '<!-- perf:end -->'
	int a = text.indexOf(begin)
	int b = text.indexOf(end)
	if (a < 0 || b < a) {
		return
	}
	def stamp = "_Generated by `./gradlew atlasPerf` on ${new Date().format('yyyy-MM-dd HH:mm')}._"
	doc.setText(text.substring(0, a + begin.length()) + '\n' + stamp + '\n\n' + rows.join('\n') + '\n' + text.substring(b), 'UTF-8')
}

// Draws a real map offline from a world's Atlas folder with today's palette (block colours from the looks.tsv the
// tour leaves there), for tuning the look without starting the game:
//   ./gradlew atlasPreview -Pworld=build/run/atlasTour/atlas/sp/<save> -Pcx=0 -Pcz=0 -Pw=1024 -Ph=640 -Pscale=2
tasks.register('atlasPreview', JavaExec) {
	group = 'atlas'
	description = 'Draws a map from a world folder offline into build/preview.png'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.voidmc.atlas.core.PreviewTool'
	jvmArgs '-Xmx3g', '-Djava.awt.headless=true'
	args = [
		(findProperty('world') ?: 'build/run/atlasTour/atlas/sp/world').toString(),
		(findProperty('dim') ?: 'minecraft/overworld').toString(),
		(findProperty('layer') ?: 'surface').toString(),
		(findProperty('cx') ?: '0').toString(),
		(findProperty('cz') ?: '0').toString(),
		(findProperty('w') ?: '1024').toString(),
		(findProperty('h') ?: '640').toString(),
		(findProperty('scale') ?: '2').toString(),
		(findProperty('out') ?: 'build/preview.png').toString()
	]
}

// A made-up landscape drawn with the palette, to judge the look against the design without the game:
//   ./gradlew atlasSynthetic   ->   build/test-images/synthetic.png
tasks.register('atlasSynthetic', JavaExec) {
	group = 'atlas'
	description = 'Draws a made-up landscape with the palette into build/test-images/synthetic.png'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.voidmc.atlas.core.SyntheticPreview'
	jvmArgs '-Djava.awt.headless=true'
	systemProperty 'atlas.test.out', file('build/test-images').absolutePath
	args = [(findProperty('scale') ?: '1').toString()]
}
