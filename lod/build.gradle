plugins {
	// 26.x ships unobfuscated, so there is no mappings line: the code is written against Mojang's own
	// names, and Loom has nothing to remap.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'void-lod'
}

repositories {
	mavenCentral()
	// Sodium and Iris, for compatibility: compiled against for their APIs, and in the dev runs only on request
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The Earth terrain model, sampled directly when Expanse is present (see ExpanseSource). In the dev
	// runs Expanse is on the classpath too, so the game tests fly over real Earth terrain.
	compileOnly 'dev.voidmc:void-expanse'
	// -Pvanilla: the game tests and runs without Expanse, on vanilla's own generator
	if (!project.hasProperty('vanilla')) {
		localRuntime 'dev.voidmc:void-expanse'
	}

	// Sodium replaces vanilla's chunk rendering and Iris its pipeline; the LOD works with both. Dev runs and
	// game tests add them with -Psodium (Sodium) or -Piris (Sodium and Iris); nothing of either ships.
	compileOnly "maven.modrinth:sodium:${project.sodium_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"
	if (project.hasProperty('sodium') || project.hasProperty('iris')) {
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
	// -Phearth=<jar>: VOID Hearth in the dev runs and game tests, to see its towns at the horizon (reached by reflection)
	if (project.hasProperty('hearth')) {
		localRuntime files(project.property('hearth'))
	}
	if (project.hasProperty('iris')) {
		localRuntime "maven.modrinth:iris:${project.iris_version}"
	}

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// Minecraft's log4j setup writes logs/ into the working directory whenever a test logs a warning: keep it in build/
	workingDir = layout.buildDirectory.dir('test-run').get().asFile
	doFirst {
		workingDir.mkdirs()
	}
	testLogging {
		events 'failed'
		exceptionFormat 'full'
		showStandardStreams = true
	}
}

// A client game test, run headless (SDL_VIDEO_FORCE_EGL=1 xvfb-run ./gradlew runClientGameTest), that
// creates an Earth world, climbs a mountain and photographs the view with the LOD off and on, logging
// what each frame cost. It lives in its own source set so none of it ships in the mod.
// Dev runs log the LOD's stats every five seconds, and take its settings from Gradle properties:
//   ./gradlew runClient -Pvoid.lod.radius=16384 -Pvoid.lod.detail=4
loom {
	runs {
		configureEach {
			property 'void.lod.logStats', 'true'
			['void.lod.radius', 'void.lod.plates', 'void.lod.chunkFade', 'void.lod.treeLevels', 'void.lod.trees', 'void.lod.exactGround', 'void.lod.detail', 'void.lod.farDetail', 'void.lod.threads', 'void.lod.budget', 'void.lod.enabled', 'void.lod.haze', 'void.lod.smoothFrom',
			 'void.lod.preset', 'void.lod.autoTune', 'void.lod.overPack', 'void.lod.packShadows', 'void.lod.generatorCache', 'void.lod.structures', 'void.lod.occlusion', 'void.lod.ingest', 'lod.show.compare',
			 'lod.show.seed', 'lod.show.distance', 'lod.show.settle', 'lod.show.views', 'lod.show.width', 'lod.show.height', 'lod.show.off', 'lod.show.only', 'lod.show.trace',
			 'lod.show.settings', 'lod.show.ingest', 'lod.show.town', 'lod.show.structures', 'lod.show.mp', 'lod.show.time', 'lod.show.seam', 'lod.show.seamFar', 'lod.show.seamSettle', 'lod.show.at', 'lod.show.faceCompare', 'lod.show.listen', 'lod.show.autumn'].each { key ->
				if (project.hasProperty(key)) {
					property key, project.property(key).toString()
				}
			}
		}
	}
}

// The game test's window is the size of its screenshots, so the LOD settles at the detail it will be photographed
// at (the test framework fixes the window at its launch size). Auto-tune is off there unless asked for, so the
// screenshots and timings show the settings as given, whatever else the machine is doing.
loom.runs.configureEach {
	if (it.name == 'clientGameTest') {
		programArgs '--width', (project.findProperty('lod.show.width') ?: '1600').toString(),
			'--height', (project.findProperty('lod.show.height') ?: '900').toString()
		property 'void.lod.autoTune', (project.findProperty('void.lod.autoTune') ?: 'false').toString()
		// -Plod.show.jfr=<file>: a flight recording of the whole run
		if (project.hasProperty('lod.show.jfr')) {
			vmArg "-XX:StartFlightRecording=filename=${project.property('lod.show.jfr')},settings=profile"
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "void-lod-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = false
	}
}

// What the horizon's quads are made of, per level, with and without trees.
tasks.register('faceBench', JavaExec) {
	group = 'lod'
	classpath = sourceSets.gametest.runtimeClasspath
	mainClass = 'dev.voidmc.lod.gametest.FaceBench'
	jvmArgs '-Xmx4g'
	args = [project.findProperty('seed') ?: '8675309']
	if (project.hasProperty('lod.bench.radii')) {
		systemProperty 'lod.bench.radii', project.property('lod.bench.radii').toString()
	}
}

// What the generator cache costs on a first visit and saves on the next (four threads, plates prebuilt).
//   ./gradlew cacheBench -Plod.bench.radii=32768
tasks.register('cacheBench', JavaExec) {
	group = 'lod'
	description = 'Benchmarks the generator cache: straight from the model, through a fresh cache, from disk'
	classpath = sourceSets.gametest.runtimeClasspath
	mainClass = 'dev.voidmc.lod.gametest.CacheBench'
	jvmArgs '-Xmx4g'
	args = [project.findProperty('seed') ?: '8675309']
	if (project.hasProperty('lod.bench.radii')) {
		systemProperty 'lod.bench.radii', project.property('lod.bench.radii').toString()
	}
}

// Times tile generation and meshing against the Earth terrain model without starting the game.
//   ./gradlew lodBench -Pseed=8675309
tasks.register('lodBench', JavaExec) {
	group = 'lod'
	description = 'Benchmarks LOD tile generation and meshing on the Earth terrain model'
	classpath = sourceSets.gametest.runtimeClasspath
	mainClass = 'dev.voidmc.lod.gametest.LodBench'
	jvmArgs "-Xmx${project.findProperty('lod.bench.xmx') ?: '3g'}"
	// -Plod.bench.jfr=out.jfr records a flight recording to profile the build
	if (project.hasProperty('lod.bench.jfr')) {
		jvmArgs "-XX:StartFlightRecording=filename=${project.property('lod.bench.jfr')},settings=default"
	}
	args = [project.findProperty('seed') ?: '8675309']
	// -Pvoid.lod.smoothFrom=99, -Plod.bench.detail=4, -Plod.bench.trees=true
	['void.lod.smoothFrom', 'lod.bench.detail', 'lod.bench.trees', 'lod.bench.faces', 'lod.bench.light', 'lod.bench.radii', 'expanse.maxPlates'].each { key ->
		if (project.hasProperty(key)) {
			systemProperty key, project.property(key).toString()
		}
	}
}
